apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-store-ingress
  namespace: retail-store
  annotations:
    kubernetes.io/ingress.class: nginx
    # Use standard NGINX path stripping: /path is stripped to /
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: retail-store.local
    http:
      paths:
      
      # 1. UI FALLBACK: Matches everything else and sends to UI
      - path: /
        pathType: Prefix
        backend:
          service:
            name: store-ui-retail-store-sample-ui-chart
            port:
              number: 8080

      # 2. CATALOG API: Matches /catalog or /catalog/ and strips /catalog
      - path: /catalog
        pathType: Prefix
        backend:
          service:
            name: store-catalog
            port:
              number: 8080
              
      # 3. CART API: Matches /cart or /cart/ and strips /cart
      - path: /cart
        pathType: Prefix
        backend:
          service:
            name: store-cart-retail-store-cart
            port:
              number: 8080
              
      # 4. ORDERS API
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: store-orders
            port:
              number: 8080
              
      # 5. CHECKOUT API
      - path: /checkout
        pathType: Prefix
        backend:
          service:
            name: checkout
            port:
              number: 8080
