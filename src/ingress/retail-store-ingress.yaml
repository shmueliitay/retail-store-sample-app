apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-store-ingress
  namespace: retail-store
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: retail-store.local
    http:
      paths:
      # Catalog
      - path: /catalog(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: store-catalog
            port:
              number: 8080
      # Cart
      - path: /cart(/.*)?
        pathType: ImplementationSpecific
        backend:
          service:
            name: store-cart-retail-store-cart
            port:
              number: 8080
      # Orders
      - path: /orders(/.*)?
        pathType: ImplementationSpecific
        backend:
          service:
            name: store-orders
            port:
              number: 8080
      # Checkout
      - path: /checkout(/.*)?
        pathType: ImplementationSpecific
        backend:
          service:
            name: checkout
            port:
              number: 8080
      # SPA fallback
      - path: /(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: store-ui-retail-store-sample-ui-chart
            port:
              number: 8080

