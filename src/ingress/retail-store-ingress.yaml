apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-store-ingress
  namespace: retail-store
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Rewrite paths to match the internal app endpoints
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: retail-store.local
      http:
        paths:
          # UI frontend at root
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store-ui-retail-store-sample-ui-chart
                port:
                  number: 8080

          # Catalog API (rewrite /catalog/* → internal /products)
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: store-catalog
                port:
                  number: 8080

          # Cart API (rewrite /cart/* → internal /carts/123)
          - path: /cart
            pathType: Prefix
            backend:
              service:
                name: store-cart-retail-store-cart
                port:
                  number: 8080

          # Orders API (rewrite /orders/* → internal /orders)
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: store-orders
                port:
                  number: 8080

          # Checkout API (rewrite /checkout/* → internal /checkout)
          - path: /checkout
            pathType: Prefix
            backend:
              service:
                name: checkout
                port:
                  number: 8080

