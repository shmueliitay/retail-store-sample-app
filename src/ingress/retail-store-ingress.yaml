apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-store-ingress
  namespace: retail-store
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    # CRITICAL GLOBAL REWRITE
    nginx.ingress.kubernetes.io/rewrite-target: /$2 
spec:
  ingressClassName: nginx
  rules:
  - host: retail-store.local
    http:
      paths:
      
      # 1. CATALOG: Using a non-capturing group to ensure /$2 is reliable.
      - path: /catalog(?:/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: store-catalog
            port:
              number: 8080
              
      # 2. CART: Using a non-capturing group.
      - path: /cart(?:/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: store-cart-retail-store-cart
            port:
              number: 8080
              
      # 3. ORDERS
      - path: /orders(?:/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: store-orders
            port:
              number: 8080
              
      # 4. CHECKOUT
      - path: /checkout(?:/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: checkout
            port:
              number: 8080
              
      # 5. UI/SPA FALLBACK FIX: Uses /()(.*) to ensure $2 captures the UI path intact.
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: store-ui-retail-store-sample-ui-chart
            port:
              number: 8080
